<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Partytown Test Page" />
    <title>Message Ports</title>
    <script src="/~partytown/debug/partytown.js"></script>
  </head>
  <body>
    <h1>Message Ports</h1>
    <ul>
      <li>
        <strong>reply through a MessagePort sent with a message</strong>
        <code id="testPortReply"></code>
      </li>
      <li>
        <strong>reply through a MessagePort sent to an iframe</strong>
        <code id="testFramePortReply"></code>
      </li>
    </ul>

    <script type="text/partytown">
      window.addEventListener('message', function (event) {
        if (event.data && event.data.ping) {
          // as an ad library answers its creative's channel
          event.ports[0].postMessage('pong from the worker');
        }
      });
      const frame = document.createElement('iframe');
      frame.id = 'frame';
      document.body.appendChild(frame);
      const frameScript = frame.contentDocument.createElement('script');
      frameScript.textContent = `
        window.addEventListener('message', function (event) {
          if (event.data && event.data.ping) {
            event.ports[0].postMessage('pong from the iframe');
          }
        });`;
      frame.contentDocument.body.appendChild(frameScript);
      frame.contentDocument.body.className = 'ready';
      document.body.classList.add('completed');
    </script>

    <script>
      const ping = function (win, id) {
        const channel = new MessageChannel();
        channel.port1.onmessage = function (event) {
          document.getElementById(id).textContent = event.data;
        };
        win.postMessage({ ping: true }, '*', [channel.port2]);
      };
      const waitForWorker = setInterval(function () {
        const frame = document.getElementById('frame');
        if (
          !document.body.classList.contains('completed') ||
          !frame ||
          frame.contentDocument.body.className !== 'ready'
        )
          return;
        clearInterval(waitForWorker);
        ping(window, 'testPortReply');
        ping(frame.contentWindow, 'testFramePortReply');
      }, 50);
    </script>

    <hr />
    <p><a href="/tests/">All Tests</a></p>
    <hr />
  </body>
</html>
