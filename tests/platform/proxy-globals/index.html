<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Partytown Test Page" />
    <title>Proxy Globals</title>

    <!-- a vinxi-style Proxy global that returns objects for any property,
         which must not end up in the worker postMessage (issue #580) -->
    <script>
      (function () {
        var chunk = function () {
          return new Proxy({}, { get: chunk });
        };
        window.MANIFEST = new Proxy(
          {},
          {
            get: function (target, name) {
              return { handler: '/h.ts', chunks: chunk(), name: name };
            },
          }
        );
      })();
    </script>

    <script src="/~partytown/debug/partytown.js"></script>
  </head>
  <body>
    <h1>Proxy Globals</h1>
    <ul>
      <li>
        <strong>worker initializes with a Proxy global on window</strong>
        <code id="testProxyGlobal"></code>
        <script type="text/partytown">
          document.getElementById('testProxyGlobal').textContent = 'initialized';
        </script>
      </li>
    </ul>

    <script type="text/partytown">
      document.body.classList.add('completed');
    </script>

    <hr />
    <p><a href="/tests/">All Tests</a></p>
    <hr />
  </body>
</html>
