<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Partytown Test Page" />
    <title>Fallback</title>
    <script>
      partytown = {
        fallbackTimeout: 1000,
        forward: [['dataLayer.push', { preserveBehavior: true }]],
      };
    </script>
    <script src="/~partytown/debug/partytown.js"></script>
    <script>
      dataLayer.push({ event: 'before fallback' });
    </script>
  </head>
  <body>
    <h1>Fallback</h1>
    <ul>
      <li>
        <strong>initial script falls back</strong>
        <code id="testInitial"></code>
      </li>
      <li>
        <strong>dynamically added script falls back</strong>
        <code id="testDynamic"></code>
      </li>
      <li>
        <strong>preserveBehavior keeps data pushed before the fallback</strong>
        <code id="testPreserved"></code>
      </li>
      <li>
        <strong>worker only scripts don't fall back</strong>
        <code id="testWorkerOnly">not executed</code>
      </li>
    </ul>

    <script type="text/partytown" data-ptworkeronly>
      document.getElementById('testWorkerOnly').textContent = 'executed initial';
    </script>

    <script type="text/partytown">
      document.getElementById('testInitial').textContent = 'executed';
      document.getElementById('testPreserved').textContent = (window.dataLayer || [])
        .map(function (item) {
          return item.event;
        })
        .join(',');
      document.body.classList.add('completed');
    </script>

    <!-- gtm-style: a partytown script injected after the fallback already ran -->
    <script>
      setTimeout(function () {
        var s = document.createElement('script');
        s.type = 'text/partytown';
        s.innerHTML = "document.getElementById('testDynamic').textContent = 'executed';";
        document.body.appendChild(s);

        var workerOnly = document.createElement('script');
        workerOnly.type = 'text/partytown';
        workerOnly.setAttribute('data-ptworkeronly', '');
        workerOnly.innerHTML =
          "document.getElementById('testWorkerOnly').textContent = 'executed dynamic';";
        document.body.appendChild(workerOnly);
      }, 1000);
    </script>

    <hr />
    <p><a href="/tests/">All Tests</a></p>
    <hr />
  </body>
</html>
