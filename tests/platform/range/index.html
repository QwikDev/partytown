<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Partytown Test Page" />
    <title>Range</title>
    <script>
      partytown = {
        logCalls: true,
        logGetters: true,
        logSetters: true,
      };
    </script>
    <script src="/~partytown/debug/partytown.js"></script>
  </head>
  <body>
    <h1>Range</h1>
    <ul>
      <li>
        <strong>createContextualFragment</strong>
        <code id="testContextualFragment"></code>
        <script type="text/partytown">
          (function () {
            const elm = document.getElementById('testContextualFragment');
            try {
              const range = document.createRange();
              const frag = range.createContextualFragment('<i id="ctxfrag">works</i>');
              const nodeName = frag.nodeName;
              document.body.appendChild(frag);
              elm.textContent =
                nodeName + ' ' + document.getElementById('ctxfrag').textContent;
            } catch (e) {
              elm.textContent = 'ERR ' + e;
            }
          })();
        </script>
      </li>

      <li>
        <strong>document.fonts</strong>
        <code id="testFonts"></code>
        <script type="text/partytown">
          (function () {
            const elm = document.getElementById('testFonts');
            try {
              Promise.resolve(document.fonts.load('16px sans-serif')).then(function (fonts) {
                elm.textContent =
                  'load:' +
                  Array.isArray(fonts) +
                  ' check:' +
                  typeof document.fonts.check('16px sans-serif') +
                  ' ready:' +
                  typeof document.fonts.ready.then;
              }, function (e) {
                elm.textContent = 'REJ ' + e;
              });
            } catch (e) {
              elm.textContent = 'ERR ' + e;
            }
          })();
        </script>
      </li>
    </ul>

    <script type="text/partytown">
      document.body.classList.add('completed');
    </script>

    <hr />
    <p><a href="/tests/">All Tests</a></p>
    <hr />
  </body>
</html>
