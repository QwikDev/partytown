<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Integration Scripts Before Environment</title>
    <script>
      partytown = { logScriptExecution: true };
    </script>
    <script src="/~partytown/debug/partytown.js"></script>
    <script>
      // trigger scans while the environment is still pending
      var ptupdateTimer = setInterval(function () {
        window.dispatchEvent(new CustomEvent('ptupdate'));
      }, 5);
      window.addEventListener('load', function () {
        clearInterval(ptupdateTimer);
      });
      // what streaming SSR does: add a partytown script while the document is still loading
      setTimeout(function () {
        var s = document.createElement('script');
        s.type = 'text/partytown';
        s.textContent = 'document.getElementById("appendedResult").textContent = "ran";';
        document.head.appendChild(s);
      }, 50);
    </script>
    <script type="text/partytown">
      document.getElementById('initialResult').textContent = 'ran';
    </script>
  </head>
  <body>
    <h1>Integration Scripts Before Environment</h1>
    <img src="./slow.png" alt="" />
    <ul>
      <li><strong>initial script</strong> <code id="initialResult"></code></li>
      <li><strong>script appended during load</strong> <code id="appendedResult"></code></li>
    </ul>
    <script type="text/partytown">
      setTimeout(function () {
        document.body.classList.add('completed');
      }, 500);
    </script>
  </body>
</html>
